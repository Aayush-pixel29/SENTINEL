<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel — Live Demo</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --success-color: #238636;
            --error-color: #da3633;
            --warning-color: #d29922;
            --card-bg: #161b22;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            display: flex;
            justify-content: center;
        }

        .header-content {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }

        button.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        button:hover:not(.active) {
            background-color: #1f2428;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
        }

        .verdict-banner {
            padding: 16px;
            border-radius: 6px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .verdict-blocked {
            background-color: rgba(218, 54, 51, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(218, 54, 51, 0.4);
        }

        .verdict-verified {
            background-color: rgba(35, 134, 54, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(35, 134, 54, 0.4);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .checks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .check-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 13px;
        }

        .check-passed { color: var(--success-color); }
        .check-failed { color: var(--error-color); }

        .finding {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 4px solid transparent;
        }

        .finding-confirmed { border-left-color: var(--error-color); }
        .finding-unconfirmed { border-left-color: var(--warning-color); }

        .finding-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .finding-title {
            font-weight: 600;
            font-size: 15px;
        }

        .finding-badge {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .badge-confirmed {
            background-color: rgba(218, 54, 51, 0.15);
            color: var(--error-color);
        }

        .badge-unconfirmed {
            background-color: rgba(212, 167, 44, 0.15);
            color: var(--warning-color);
        }

        .finding-meta {
            font-family: var(--font-mono);
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 12px;
        }

        .finding-body {
            font-size: 14px;
            line-height: 1.5;
        }

        .finding-evidence {
            margin-top: 12px;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            font-size: 13px;
            border-left: 2px solid var(--border-color);
        }

        .empty-state {
            color: #8b949e;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        .diff-view {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            font-family: var(--font-mono);
            font-size: 13px;
            white-space: pre-wrap;
            overflow-x: auto;
            line-height: 1.4;
        }

        .diff-add { color: var(--success-color); }
        .diff-sub { color: var(--error-color); }
        .diff-meta { color: #8b949e; }
    </style>
</head>
<body>
    <script src="data.js"></script>

    <div class="header">
        <div class="header-content">
            <div class="title">🛡️ Sentinel Web Demo</div>
            <div class="controls">
                <button id="btn-vulnerable" class="active" onclick="renderReport(vulnerableReport, 'btn-vulnerable')">Simulate Vulnerable Code</button>
                <button id="btn-fixed" onclick="renderReport(fixedReport, 'btn-fixed')">Simulate Fixed Code</button>
            </div>
        </div>
    </div>

    <div class="container" id="report-container">
        <!-- Rendered via JS -->
    </div>

    <script>
        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function formatDiff(diffText) {
            return diffText.split('\n').map(line => {
                if (line.startsWith('+')) return `<span class="diff-add">${escapeHtml(line)}</span>`;
                if (line.startsWith('-')) return `<span class="diff-sub">${escapeHtml(line)}</span>`;
                if (line.startsWith('@@') || line.startsWith('diff')) return `<span class="diff-meta">${escapeHtml(line)}</span>`;
                return escapeHtml(line);
            }).join('\n');
        }

        function renderReport(report, activeBtnId) {
            // Update buttons
            document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(activeBtnId).classList.add('active');

            const container = document.getElementById('report-container');
            
            // Verdict
            const isVerified = report.verdict === 'VERIFIED';
            const verdictHtml = `
                <div class="card">
                    <div class="verdict-banner ${isVerified ? 'verdict-verified' : 'verdict-blocked'}">
                        ${isVerified ? '✓ VERIFIED' : '🔴 BLOCKED'}
                    </div>
                    <div style="font-family: var(--font-mono); font-size: 13px; color: #8b949e;">
                        Commit: ${report.commit} | Branch: ${report.branch}
                    </div>
                </div>
            `;

            // Checks
            const checksHtml = report.checks.map(c => `
                <div class="check-item">
                    <span>${c.name}</span>
                    <span class="${c.status === 'PASSED' ? 'check-passed' : 'check-failed'}">
                        ${c.status === 'PASSED' ? '✓ PASSED' : '✗ FAILED'}
                    </span>
                </div>
            `).join('');

            // Findings
            const allFindings = [...(report.confirmed_findings || []), ...(report.unconfirmed_findings || [])];
            let findingsHtml = '';
            
            if (allFindings.length === 0) {
                findingsHtml = `<div class="empty-state">No vulnerabilities or concerns detected.</div>`;
            } else {
                findingsHtml = allFindings.map(f => {
                    const isConfirmed = f.classification === 'CONFIRMED';
                    return `
                    <div class="finding ${isConfirmed ? 'finding-confirmed' : 'finding-unconfirmed'}">
                        <div class="finding-header">
                            <div class="finding-title">${escapeHtml(f.title)}</div>
                            <div class="finding-badge ${isConfirmed ? 'badge-confirmed' : 'badge-unconfirmed'}">
                                ${isConfirmed ? 'CONFIRMED EVIDENCE' : 'UNCONFIRMED AI CONCERN'}
                            </div>
                        </div>
                        <div class="finding-meta">
                            Source: ${escapeHtml(f.source)} | Location: ${escapeHtml(f.file)}:${escapeHtml(f.line)}
                        </div>
                        <div class="finding-body">
                            ${escapeHtml(f.description)}
                            <div class="finding-evidence">
                                <strong>Evidence:</strong> ${escapeHtml(f.evidence)}<br><br>
                                <strong>Recommendation:</strong> ${escapeHtml(f.recommendation)}
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');
            }

            // Diff
            const diffHtml = report.metadata?.diff_text ? formatDiff(report.metadata.diff_text) : 'No diff available';

            container.innerHTML = `
                ${verdictHtml}
                
                <div class="card">
                    <h3 class="section-title">Git Diff Evaluated</h3>
                    <div class="diff-view">${diffHtml}</div>
                </div>

                <div class="card">
                    <h3 class="section-title">Verification Checks</h3>
                    <div class="checks-grid">
                        ${checksHtml}
                    </div>
                    
                    <h3 class="section-title" style="margin-top: 32px;">Findings</h3>
                    ${findingsHtml}
                </div>
            `;
        }

        // Initial render
        renderReport(vulnerableReport, 'btn-vulnerable');
    </script>
</body>
</html>
